<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Family Tracker</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111319;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box { text-align: center; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #3a3f4b;
    border-top-color: #7cc4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #msg { font-size: 15px; color: #ccc; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div id="msg">Opening Family Tracker&hellip;</div>
</div>
<script>
  var target = "http://127.0.0.1:4173";
  var tries = 0;

  function check() {
    fetch(target, { mode: "no-cors", cache: "no-store" })
      .then(function () {
        window.location.href = target;
      })
      .catch(function () {
        tries++;
        document.getElementById("msg").textContent = tries > 5
          ? "Still starting… this can take a few extra seconds right after a restart."
          : "Opening Family Tracker…";
        setTimeout(check, 1000);
      });
  }

  check();
</script>
</body>
</html>
