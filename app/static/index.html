<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header id="app-header">
  <h1 id="app-title">Family Tracker</h1>
  <div class="header-right">
    <button id="review-btn" class="review-btn hidden">📬 <span id="review-count">0</span></button>
    <div id="save-status" class="save-status">Loading…</div>
  </div>
</header>

<nav id="board-tabs" class="board-tabs"></nav>

<div id="board-description" class="board-description"></div>

<main id="board-columns" class="board-columns"></main>

<div id="review-modal" class="modal hidden">
  <div class="modal-content">
    <button id="review-close" class="modal-close" aria-label="Close">&times;</button>
    <h2 class="modal-heading">📬 Email review</h2>
    <p class="modal-sub" id="review-sub"></p>
    <div id="review-pending"></div>
    <div id="review-activity"></div>
  </div>
</div>

<div id="card-modal" class="modal hidden">
  <div class="modal-content">
    <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
    <h2 id="card-modal-heading" class="modal-heading"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-delete" class="btn btn-danger">Delete</button>
      <button id="modal-save" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
